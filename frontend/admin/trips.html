<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Trips - ATBU Shuttle</title>
  <meta name="theme-color" content="#003366">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/images/icon-192.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand"><img src="/images/school_logo.jpg" alt="ATBU" onerror="this.style.display='none'"><span>ATBU Shuttle</span></a>
    <button class="mobile-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <div class="navbar-right">
      <ul class="navbar-nav" id="admin-nav">
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/trips">Book Ticket</a></li>
        <li><a href="/admin" class="active">Admin</a></li>
        <li><a href="/admin/buses">Buses</a></li>
        <li><a href="/admin/trips" class="active">Trips</a></li>
        <li><a href="/admin/bookings">Bookings</a></li>
        <li><button class="btn-logout" onclick="logout()">Logout</button></li>
      </ul>
    </div>
  </nav>

  <main class="container" style="padding-top:2rem;padding-bottom:3rem;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
      <h1 style="margin:0;">Manage Trips</h1>
      <button class="btn btn-primary" onclick="showAddForm()">+ Add New Trip</button>
    </div>

    <div class="card" id="add-form" style="display:none;margin-bottom:1.5rem;">
      <div class="card-header"><h2>Create New Trip</h2></div>
      <div class="card-body">
        <div class="form-row">
          <div class="form-group"><label>Bus</label><select id="trip-bus"><option value="">Select bus</option></select></div>
          <div class="form-group"><label>Origin</label><select id="trip-origin"><option value="Yelwa Campus">Yelwa Campus</option><option value="Gubi Campus">Gubi Campus</option></select></div>
          <div class="form-group"><label>Destination</label><select id="trip-destination"><option value="Gubi Campus">Gubi Campus</option><option value="Yelwa Campus">Yelwa Campus</option></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Date</label><input type="date" id="trip-date"></div>
          <div class="form-group"><label>Departure Time</label><input type="time" id="trip-time" value="08:00"></div>
          <div class="form-group"><label>Price (₦)</label><input type="number" id="trip-price" value="500" min="0"></div>
        </div>
        <div style="display:flex;gap:0.5rem;margin-top:1rem;">
          <button class="btn btn-primary" onclick="createTrip()">Create Trip</button>
          <button class="btn btn-secondary" onclick="hideAddForm()">Cancel</button>
        </div>
      </div>
    </div>

    <div class="card" id="edit-form" style="display:none;margin-bottom:1.5rem;">
      <div class="card-header"><h2>Edit Trip</h2></div>
      <div class="card-body">
        <input type="hidden" id="edit-trip-id">
        <div class="form-row">
          <div class="form-group"><label>Price (₦)</label><input type="number" id="edit-price" min="0"></div>
          <div class="form-group"><label>Departure Time</label><input type="time" id="edit-time"></div>
        </div>
        <div style="display:flex;gap:0.5rem;margin-top:1rem;">
          <button class="btn btn-primary" onclick="updateTrip()">Save Changes</button>
          <button class="btn btn-secondary" onclick="hideEditForm()">Cancel</button>
        </div>
      </div>
    </div>

    <div id="trips-loading">
      <div class="skeleton-card" style="margin-bottom:1rem;">
        <div class="skeleton skeleton-line long"></div>
        <div class="skeleton skeleton-line medium"></div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton skeleton-line long"></div>
        <div class="skeleton skeleton-line medium"></div>
      </div>
    </div>

    <div id="trips-list" style="display:none;"></div>
  </main>

  <footer class="footer">
    <div class="container"><p>&copy; 2026 ATBU Shuttle. All rights reserved.</p></div>
  </footer>

  <script src="/js/auth.js"></script>
  <script>
    if (!requireAdmin()) throw new Error('Not admin');

    function showAddForm() { document.getElementById('add-form').style.display = 'block'; }
    function hideAddForm() { document.getElementById('add-form').style.display = 'none'; }
    function hideEditForm() { document.getElementById('edit-form').style.display = 'none'; }

    async function loadBuses() {
      const res = await apiRequest('/buses');
      if (res && res.success) {
        const sel = document.getElementById('trip-bus');
        sel.innerHTML = '<option value="">Select bus</option>';
        for (const bus of res.data.filter(b => b.status === 'active')) {
          sel.innerHTML += `<option value="${bus.bus_id}">${bus.bus_name} (${bus.bus_number}) - Cap: ${bus.capacity}</option>`;
        }
      }
    }

    async function loadTrips() {
      const res = await apiRequest('/trips/search');
      document.getElementById('trips-loading').style.display = 'none';
      document.getElementById('trips-list').style.display = 'block';

      if (!res || !res.success) {
        document.getElementById('trips-list').innerHTML = '<div class="alert alert-error">Failed to load trips. <button class="btn btn-sm btn-primary" onclick="location.reload()" style="margin-left:0.5rem;">Retry</button></div>';
        return;
      }

      const trips = res.data;
      if (trips.length === 0) {
        document.getElementById('trips-list').innerHTML = '<div class="empty-state"><div class="icon">🗺</div><h3>No trips yet</h3><p>Create your first trip to get started.</p></div>';
        return;
      }

      let html = '<div class="bookings-table-wrapper"><table class="bookings-table"><thead><tr><th>Route</th><th>Date</th><th>Time</th><th>Bus</th><th>Price</th><th>Capacity</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
      for (const t of trips) {
        const statusClass = t.booking_status === 'available' ? 'status-confirmed' : 'status-cancelled';
        html += `<tr>
          <td>${t.origin} → ${t.destination}</td>
          <td>${formatDate(t.departure_date)}</td>
          <td>${formatTime(t.departure_time)}</td>
          <td>${t.bus_name} (${t.bus_number})</td>
          <td>${formatCurrency(t.price)}</td>
          <td>${t.confirmed_passengers}/${t.capacity}</td>
          <td><span class="${statusClass}">${t.booking_status === 'available' ? 'AVAILABLE' : 'FULLY BOOKED'}</span></td>
          <td style="white-space:nowrap;">
            <button class="btn btn-sm btn-secondary" onclick="editTrip(${t.trip_id}, ${t.price}, '${t.departure_time}')">Edit</button>
            <button class="btn btn-sm btn-secondary" onclick="cancelTrip(${t.trip_id})">Cancel</button>
          </td>
        </tr>`;
      }
      html += '</tbody></table></div>';
      document.getElementById('trips-list').innerHTML = html;
    }

    function editTrip(id, price, time) {
      document.getElementById('edit-trip-id').value = id;
      document.getElementById('edit-price').value = price;
      document.getElementById('edit-time').value = time.substring(0, 5);
      document.getElementById('edit-form').style.display = 'block';
      window.scrollTo({ top: document.getElementById('edit-form').offsetTop - 80, behavior: 'smooth' });
    }

    async function updateTrip() {
      const id = document.getElementById('edit-trip-id').value;
      const price = parseFloat(document.getElementById('edit-price').value);
      const time = document.getElementById('edit-time').value + ':00';
      const res = await apiRequest(`/trips/${id}`, {
        method: 'PUT',
        body: JSON.stringify({ price, departure_time: time })
      });
      if (res && res.success) { hideEditForm(); loadTrips(); }
      else alert(res ? res.message : 'Failed to update trip.');
    }

    async function createTrip() {
      const bus_id = parseInt(document.getElementById('trip-bus').value);
      const origin = document.getElementById('trip-origin').value;
      const destination = document.getElementById('trip-destination').value;
      const date = document.getElementById('trip-date').value;
      const time = document.getElementById('trip-time').value + ':00';
      const price = parseFloat(document.getElementById('trip-price').value);

      if (!bus_id || !date) { alert('Please fill all fields.'); return; }
      if (origin === destination) { alert('Origin and destination must be different.'); return; }

      const res = await apiRequest('/trips', {
        method: 'POST',
        body: JSON.stringify({ bus_id, origin, destination, departure_date: date, departure_time: time, price })
      });

      if (res && res.success) {
        hideAddForm();
        document.getElementById('trips-loading').style.display = 'block';
        document.getElementById('trips-list').style.display = 'none';
        loadTrips();
      } else {
        alert(res ? res.message : 'Failed to create trip.');
      }
    }

    async function cancelTrip(id) {
      if (!confirm('Are you sure you want to cancel this trip? All confirmed passengers will be notified.')) return;
      const res = await apiRequest(`/trips/${id}/cancel`, { method: 'PUT' });
      if (res && res.success) {
        document.getElementById('trips-loading').style.display = 'block';
        document.getElementById('trips-list').style.display = 'none';
        loadTrips();
      } else alert(res ? res.message : 'Failed to cancel trip.');
    }

    document.getElementById('trip-origin').addEventListener('change', function() {
      document.getElementById('trip-destination').value = this.value === 'Yelwa Campus' ? 'Gubi Campus' : 'Yelwa Campus';
    });

    loadBuses();
    loadTrips();
  </script>
</body>
</html>
