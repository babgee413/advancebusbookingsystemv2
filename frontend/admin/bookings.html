<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Bookings - ATBU Shuttle</title>
  <meta name="theme-color" content="#003366">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/images/icon-192.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand"><img src="/images/school_logo.jpg" alt="ATBU" onerror="this.style.display='none'"><span>ATBU Shuttle</span></a>
    <button class="mobile-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <div class="navbar-right">
      <ul class="navbar-nav" id="admin-nav">
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/trips">Book Ticket</a></li>
        <li><a href="/admin" class="active">Admin</a></li>
        <li><a href="/admin/buses">Buses</a></li>
        <li><a href="/admin/trips">Trips</a></li>
        <li><a href="/admin/bookings" class="active">Bookings</a></li>
        <li><button class="btn-logout" onclick="logout()">Logout</button></li>
      </ul>
    </div>
  </nav>

  <main class="container" style="padding-top:2rem;padding-bottom:3rem;">
    <h1 style="margin-bottom:1.5rem;">Manage Bookings</h1>

    <div class="card" style="margin-bottom:1.5rem;">
      <div class="card-body">
        <div class="form-row">
          <div class="form-group">
            <label>Status</label>
            <select id="filter-status">
              <option value="">All Statuses</option>
              <option value="pending_payment">Pending Payment</option>
              <option value="confirmed">Confirmed</option>
              <option value="rejected">Rejected</option>
              <option value="cancelled">Cancelled</option>
              <option value="no_show">No Show</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div class="form-group">
            <label>Route</label>
            <select id="filter-route">
              <option value="">All Routes</option>
              <option value="Yelwa Campus">From Yelwa</option>
              <option value="Gubi Campus">From Gubi</option>
            </select>
          </div>
          <div class="form-group">
            <label>Search (Ticket/Name/Reg)</label>
            <input type="text" id="filter-search" placeholder="Search...">
          </div>
          <div class="form-group" style="align-self:flex-end;">
            <button class="btn btn-primary" onclick="filterBookings()" style="width:100%;">Filter</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card" id="reschedule-form" style="display:none;margin-bottom:1.5rem;">
      <div class="card-header"><h2>Reschedule Booking</h2></div>
      <div class="card-body">
        <input type="hidden" id="reschedule-booking-id">
        <p id="reschedule-info" style="margin-bottom:1rem;"></p>
        <div class="form-group">
          <label>Select New Trip</label>
          <select id="reschedule-trip"><option value="">Loading trips...</option></select>
        </div>
        <div style="display:flex;gap:0.5rem;margin-top:1rem;">
          <button class="btn btn-primary" onclick="confirmReschedule()">Confirm Reschedule</button>
          <button class="btn btn-secondary" onclick="document.getElementById('reschedule-form').style.display='none'">Cancel</button>
        </div>
      </div>
    </div>

    <div id="bookings-loading">
      <div class="skeleton-card" style="margin-bottom:1rem;">
        <div class="skeleton skeleton-line long"></div>
        <div class="skeleton skeleton-line medium"></div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton skeleton-line long"></div>
        <div class="skeleton skeleton-line medium"></div>
      </div>
    </div>

    <div id="bookings-list" style="display:none;"></div>
  </main>

  <footer class="footer">
    <div class="container"><p>&copy; 2026 ATBU Shuttle. All rights reserved.</p></div>
  </footer>

  <script src="/js/auth.js"></script>
  <script>
    if (!requireAdmin()) throw new Error('Not admin');

    function filterBookings() {
      document.getElementById('bookings-loading').style.display = 'block';
      document.getElementById('bookings-list').style.display = 'none';
      loadBookings();
    }

    async function loadBookings() {
      const status = document.getElementById('filter-status').value;
      const origin = document.getElementById('filter-route').value;
      const search = document.getElementById('filter-search').value;

      const params = new URLSearchParams();
      if (status) params.append('status', status);
      if (origin) params.append('origin', origin);
      if (search) params.append('search', search);

      const res = await apiRequest(`/bookings/all?${params}`);
      document.getElementById('bookings-loading').style.display = 'none';
      document.getElementById('bookings-list').style.display = 'block';

      if (!res || !res.success) {
        document.getElementById('bookings-list').innerHTML = '<div class="alert alert-error">Failed to load bookings. <button class="btn btn-sm btn-primary" onclick="filterBookings()" style="margin-left:0.5rem;">Retry</button></div>';
        return;
      }

      const bookings = res.data;
      if (bookings.length === 0) {
        document.getElementById('bookings-list').innerHTML = '<div class="empty-state"><div class="icon">📋</div><h3>No bookings found</h3><p>No bookings match your current filters.</p></div>';
        return;
      }

      let html = '<div class="bookings-table-wrapper"><table class="bookings-table"><thead><tr><th>Ticket</th><th>Passenger</th><th>Reg No</th><th>Route</th><th>Date</th><th>Time</th><th>Amount</th><th>Status</th><th>Payment</th><th>Actions</th></tr></thead><tbody>';
      for (const b of bookings) {
        const statusClass = b.booking_status === 'confirmed' ? 'status-confirmed' :
                           b.booking_status === 'cancelled' || b.booking_status === 'rejected' || b.booking_status === 'no_show' ? 'status-cancelled' :
                           'status-pending';
        const payClass = b.payment_status === 'paid' ? 'status-confirmed' : 'status-pending';

        html += `<tr>
          <td><strong>${b.ticket_number}</strong></td>
          <td>${b.passenger_name}</td>
          <td>${b.registration_number}</td>
          <td>${b.origin} → ${b.destination}</td>
          <td>${formatDate(b.departure_date)}</td>
          <td>${formatTime(b.departure_time)}</td>
          <td>${formatCurrency(b.amount_paid)}</td>
          <td><span class="${statusClass}">${b.booking_status.replace('_', ' ').toUpperCase()}</span></td>
          <td><span class="${payClass}">${b.payment_status.toUpperCase()}</span></td>
          <td style="white-space:nowrap;">
            ${b.booking_status === 'confirmed' ? `
              <button class="btn btn-sm btn-secondary" onclick="showReschedule(${b.booking_id}, '${b.ticket_number}', '${b.origin}', '${b.destination}', ${b.trip_id})">Reschedule</button>
              <button class="btn btn-sm btn-secondary" onclick="rejectBooking(${b.booking_id})">Reject</button>
              <button class="btn btn-sm btn-secondary" onclick="markNoShow(${b.booking_id})">No Show</button>
            ` : ''}
            ${b.booking_status === 'confirmed' ? `<button class="btn btn-sm btn-secondary" onclick="viewTicket('${b.ticket_number}')">Ticket</button>` : ''}
          </td>
        </tr>`;
      }
      html += '</tbody></table></div>';
      document.getElementById('bookings-list').innerHTML = html;
    }

    async function showReschedule(bookingId, ticketNumber, origin, destination, currentTripId) {
      document.getElementById('reschedule-booking-id').value = bookingId;
      document.getElementById('reschedule-info').textContent = `Rescheduling ${ticketNumber} (${origin} → ${destination})`;
      const res = await apiRequest(`/trips/search?origin=${origin}&destination=${destination}`);
      const sel = document.getElementById('reschedule-trip');
      sel.innerHTML = '<option value="">Select new trip</option>';
      if (res && res.success) {
        for (const t of res.data.filter(trip => trip.trip_id !== currentTripId && trip.available_spaces > 0)) {
          sel.innerHTML += `<option value="${t.trip_id}">${formatDate(t.departure_date)} ${formatTime(t.departure_time)} - ${t.bus_name} (${t.available_spaces} spaces)</option>`;
        }
      }
      document.getElementById('reschedule-form').style.display = 'block';
      window.scrollTo({ top: document.getElementById('reschedule-form').offsetTop - 80, behavior: 'smooth' });
    }

    async function confirmReschedule() {
      const bookingId = document.getElementById('reschedule-booking-id').value;
      const newTripId = parseInt(document.getElementById('reschedule-trip').value);
      if (!newTripId) { alert('Please select a new trip.'); return; }
      const res = await apiRequest(`/bookings/${bookingId}/reschedule`, {
        method: 'PUT',
        body: JSON.stringify({ new_trip_id: newTripId })
      });
      if (res && res.success) {
        document.getElementById('reschedule-form').style.display = 'none';
        document.getElementById('bookings-loading').style.display = 'block';
        document.getElementById('bookings-list').style.display = 'none';
        loadBookings();
      } else {
        alert(res ? res.message : 'Failed to reschedule.');
      }
    }

    async function rejectBooking(id) {
      const reason = prompt('Enter rejection reason:');
      if (reason === null) return;
      const res = await apiRequest(`/bookings/${id}/reject`, {
        method: 'PUT',
        body: JSON.stringify({ reason })
      });
      if (res && res.success) {
        document.getElementById('bookings-loading').style.display = 'block';
        document.getElementById('bookings-list').style.display = 'none';
        loadBookings();
      } else alert(res ? res.message : 'Failed to reject.');
    }

    async function markNoShow(id) {
      if (!confirm('Mark this passenger as no-show?')) return;
      const res = await apiRequest(`/bookings/${id}/no-show`, { method: 'PUT' });
      if (res && res.success) {
        document.getElementById('bookings-loading').style.display = 'block';
        document.getElementById('bookings-list').style.display = 'none';
        loadBookings();
      }
    }

    function viewTicket(ticketNumber) {
      window.open(`/ticket?ticket=${ticketNumber}`, '_blank');
    }

    loadBookings();
  </script>
</body>
</html>
