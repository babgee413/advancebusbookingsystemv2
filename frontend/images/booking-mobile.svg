<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003366;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#28a745;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg4)" rx="12"/>
  <!-- Phone -->
  <rect x="140" y="30" width="120" height="220" fill="#1a1a2e" rx="16"/>
  <rect x="148" y="50" width="104" height="180" fill="white" rx="4"/>
  <!-- Screen content -->
  <rect x="155" y="58" width="90" height="12" fill="#003366" rx="2"/>
  <rect x="155" y="76" width="60" height="8" fill="#ccc" rx="2"/>
  <!-- Seat grid -->
  <rect x="160" y="95" width="20" height="18" fill="#28a745" rx="3"/>
  <rect x="185" y="95" width="20" height="18" fill="#28a745" rx="3"/>
  <rect x="210" y="95" width="20" height="18" fill="#28a745" rx="3"/>
  <rect x="160" y="118" width="20" height="18" fill="#28a745" rx="3"/>
  <rect x="185" y="118" width="20" height="18" fill="#dc3545" rx="3"/>
  <rect x="210" y="118" width="20" height="18" fill="#28a745" rx="3"/>
  <rect x="160" y="141" width="20" height="18" fill="#003366" rx="3"/>
  <rect x="185" y="141" width="20" height="18" fill="#28a745" rx="3"/>
  <rect x="210" y="141" width="20" height="18" fill="#dc3545" rx="3"/>
  <!-- Button -->
  <rect x="170" y="170" width="60" height="20" fill="#c8102e" rx="10"/>
  <text x="200" y="184" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">BOOK NOW</text>
  <!-- Home button -->
  <circle cx="200" cy="240" r="5" fill="#555"/>
  <!-- People icons -->
  <circle cx="60" cy="120" r="15" fill="#003366" opacity="0.3"/>
  <rect x="48" y="140" width="24" height="30" fill="#003366" opacity="0.3" rx="5"/>
  <circle cx="340" cy="140" r="15" fill="#003366" opacity="0.3"/>
  <rect x="328" y="160" width="24" height="30" fill="#003366" opacity="0.3" rx="5"/>
  <!-- Wifi icon -->
  <path d="M185,260 Q200,250 215,260" stroke="#003366" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M175,268 Q200,255 225,268" stroke="#003366" stroke-width="2" fill="none" opacity="0.3"/>
</svg>
