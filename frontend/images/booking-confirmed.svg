<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#28a745;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#003366;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg6)" rx="12"/>
  <!-- Success circle -->
  <circle cx="200" cy="120" r="60" fill="#28a745"/>
  <circle cx="200" cy="120" r="50" fill="#28a745"/>
  <!-- Checkmark -->
  <polyline points="175,120 193,138 228,103" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Text -->
  <text x="200" y="210" font-family="Arial,sans-serif" font-size="18" fill="#003366" text-anchor="middle" font-weight="bold">Booking Confirmed!</text>
  <text x="200" y="235" font-family="Arial,sans-serif" font-size="12" fill="#666" text-anchor="middle">Your seat has been reserved</text>
  <!-- Confetti dots -->
  <circle cx="80" cy="60" r="4" fill="#f0c040"/>
  <circle cx="320" cy="50" r="3" fill="#c8102e"/>
  <circle cx="60" cy="200" r="3" fill="#003366"/>
  <circle cx="340" cy="180" r="4" fill="#28a745"/>
  <circle cx="100" cy="250" r="3" fill="#c8102e"/>
  <circle cx="300" cy="260" r="3" fill="#f0c040"/>
</svg>
